<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

<title>RatVad VPN</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{

    width:100%;
    height:100%;
    overflow:hidden;

    font-family:Arial,sans-serif;

    background:#200000;
}

/* =====================================
   ФОН
===================================== */

body{

    background:
    linear-gradient(
        to bottom,
        #180000 0%,
        #470000 25%,
        #7f0000 55%,
        #b30000 100%
    );

    color:white;
}

/* =====================================
   APP
===================================== */

.app{

    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;
}

/* =====================================
   ШАПКА
===================================== */

.header{

    width:100%;
    height:54px;

    background:#320000;

    border-bottom:
    2px solid rgba(255,255,255,0.1);

    flex-shrink:0;
}

/* =====================================
   ЦЕНТР
===================================== */

.center{

    flex:1;

    overflow-y:auto;

    padding:12px 12px 20px;

    scrollbar-width:none;
}

.center::-webkit-scrollbar{
    display:none;
}

/* =====================================
   КОНТЕНТ
===================================== */

.content{

    width:100%;

    max-width:430px;

    margin:auto;
}

/* =====================================
   БЛОК КНОПОК
===================================== */

.buttons-box{

    height:calc(100vh - 86px);

    min-height:560px;

    border-radius:42px;

    overflow:hidden;

    background:#210000;

    padding:12px;

    display:flex;
    flex-direction:column;

    gap:12px;
}

/* =====================================
   ОБЩИЕ КНОПКИ
===================================== */

.sound-btn{

    flex:1;

    border:none;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    color:white;

    font-weight:bold;

    cursor:pointer;

    transition:0.15s;

    position:relative;

    overflow:hidden;
}

.sound-btn:active{

    transform:scale(0.988);
}

/* =====================================
   УГЛЫ
===================================== */

/* ВЕРХНЯЯ */

.record{

    background:#b50000;

    border-radius:
    26px 26px 8px 8px;
}

/* СРЕДНЯЯ */

.play{

    background:#00d000;

    border-radius:8px;
}

/* НИЖНЯЯ */

.reverse{

    background:#1580f0;

    border-radius:
    8px 8px 26px 26px;
}

/* =====================================
   ИКОНКИ
===================================== */

.sound-btn img{

    width:min(22vw,110px);

    height:min(22vw,110px);

    object-fit:contain;

    margin-bottom:20px;

    pointer-events:none;
}

/* =====================================
   ТЕКСТ
===================================== */

.sound-btn span{

    font-size:
    clamp(22px,4vw,34px);
}

/* =====================================
   ФУТЕР
===================================== */

.footer{

    margin-top:14px;

    width:100%;

    background:#220000;

    border-radius:28px;

    padding:18px 16px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:14px;
}

/* ТЕКСТ */

.footer-text{

    display:flex;
    flex-direction:column;
}

.footer-title{

    font-size:
    clamp(20px,4vw,28px);

    font-weight:bold;

    color:white;
}

.footer-copy{

    font-size:
    clamp(12px,2vw,16px);

    color:rgba(255,255,255,0.7);

    margin-top:4px;
}

/* VPN КНОПКА */

.vpn-btn{

    background:
    linear-gradient(
        to bottom,
        #2894ff,
        #006cff
    );

    color:white;

    text-decoration:none;

    padding:16px 26px;

    border-radius:18px;

    font-size:
    clamp(18px,3.5vw,26px);

    font-weight:bold;

    white-space:nowrap;

    box-shadow:
    0 4px 14px rgba(0,0,0,0.35);
}

.vpn-btn:active{

    transform:scale(0.985);
}

/* =====================================
   МАЛЕНЬКИЕ ЭКРАНЫ
===================================== */

@media(max-height:760px){

    .buttons-box{

        padding:10px;
        gap:10px;
    }

    .sound-btn img{

        width:72px;
        height:72px;

        margin-bottom:12px;
    }

    .footer{

        padding:14px;
    }
}

</style>
</head>

<body>

<div class="app">

    <!-- ==========================
         ШАПКА
    =========================== -->

    <div class="header"></div>

    <!-- ==========================
         ЦЕНТР
    =========================== -->

    <div class="center">

        <div class="content">

            <!-- ==========================
                 КНОПКИ
            =========================== -->

            <div class="buttons-box">

                <!-- ЗАПИСЬ -->

                <button
                class="sound-btn record"
                id="recordBtn">

                    <!-- ВСТАВЬ ССЫЛКУ -->
                    <img src="https://raw.githubusercontent.com/TrashBagStudio/Recorder/refs/heads/main/micro.png">

                    <span>
                        Запись звука
                    </span>

                </button>

                <!-- ПРОИГРАТЬ -->

                <button
                class="sound-btn play"
                id="playBtn">

                    <!-- ВСТАВЬ ССЫЛКУ -->
                    <img src="https://raw.githubusercontent.com/TrashBagStudio/Recorder/refs/heads/main/play.png">

                    <span>
                        Играть запись
                    </span>

                </button>

                <!-- РЕВЕРС -->

                <button
                class="sound-btn reverse"
                id="reverseBtn">

                    <!-- ВСТАВЬ ССЫЛКУ -->
                    <img src="https://raw.githubusercontent.com/TrashBagStudio/Recorder/refs/heads/main/reverse.png">

                    <span>
                        Реверс записи
                    </span>

                </button>

            </div>

            <!-- ==========================
                 ФУТЕР
            =========================== -->

            <div class="footer">

                <div class="footer-text">

                    <div class="footer-title">
                        RatVad VPN
                    </div>

                    <div class="footer-copy">
                        © 2025 Все права защищены.
                        Безопасный VPN для анонимного доступа.
                    </div>

                </div>

                <!-- ВСТАВЬ ССЫЛКУ -->

                <a
                href="VPN_LINK"
                class="vpn-btn">

                    Открыть VPN

                </a>

            </div>

        </div>

    </div>

</div>

<script>

/* =====================================
   AUDIO
===================================== */

let mediaRecorder;

let audioChunks = [];

let recordedBlob = null;

let audioURL = null;

let audioPlayer = null;

/* =====================================
   КНОПКИ
===================================== */

const recordBtn =
document.getElementById("recordBtn");

const playBtn =
document.getElementById("playBtn");

const reverseBtn =
document.getElementById("reverseBtn");

/* =====================================
   ЗАПИСЬ
===================================== */

recordBtn.onclick = async ()=>{

    try{

        if(
            mediaRecorder &&
            mediaRecorder.state === "recording"
        ){

            mediaRecorder.stop();

            recordBtn.style.opacity = "1";

            return;
        }

        const stream =
        await navigator
        .mediaDevices
        .getUserMedia({
            audio:true
        });

        audioChunks = [];

        mediaRecorder =
        new MediaRecorder(stream);

        mediaRecorder.ondataavailable = e=>{

            audioChunks.push(e.data);
        };

        mediaRecorder.onstop = ()=>{

            recordedBlob =
            new Blob(audioChunks,{
                type:"audio/webm"
            });

            audioURL =
            URL.createObjectURL(
                recordedBlob
            );

            audioPlayer =
            new Audio(audioURL);
        };

        mediaRecorder.start();

        recordBtn.style.opacity = "0.7";

    }catch(err){

        alert(
            "Нет доступа к микрофону"
        );

        console.log(err);
    }
};

/* =====================================
   ПРОИГРАТЬ
===================================== */

playBtn.onclick = ()=>{

    if(!audioPlayer){

        alert(
            "Сначала сделай запись"
        );

        return;
    }

    audioPlayer.pause();

    audioPlayer.currentTime = 0;

    audioPlayer.play();
};

/* =====================================
   РЕВЕРС
===================================== */

reverseBtn.onclick = async ()=>{

    if(!recordedBlob){

        alert(
            "Сначала сделай запись"
        );

        return;
    }

    const arrayBuffer =
    await recordedBlob.arrayBuffer();

    const audioContext =
    new (
        window.AudioContext ||
        window.webkitAudioContext
    )();

    const buffer =
    await audioContext
    .decodeAudioData(arrayBuffer);

    for(
        let i=0;
        i<buffer.numberOfChannels;
        i++
    ){

        Array
        .prototype
        .reverse
        .call(
            buffer.getChannelData(i)
        );
    }

    const source =
    audioContext.createBufferSource();

    source.buffer = buffer;

    source.connect(
        audioContext.destination
    );

    source.start(0);
};

</script>

</body>
</html>
