<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

<title>RatVad VPN</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{

    width:100%;
    height:100%;
    overflow:hidden;

    font-family:Arial,sans-serif;

    background:#300000;
}

/* ====================================
   ОСНОВНОЙ ФОН
==================================== */

body{

    background:
    linear-gradient(
        to bottom,
        #1a0000 0%,
        #4b0000 20%,
        #790000 45%,
        #9f0000 70%,
        #c30000 100%
    );

    color:white;
}

/* ====================================
   ПРИЛОЖЕНИЕ
==================================== */

.app{

    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;

    overflow:hidden;
}

/* ====================================
   ШАПКА
==================================== */

.header{

    width:100%;
    height:58px;

    background:#3a0000;

    border-bottom:
    2px solid rgba(255,255,255,0.15);

    position:relative;

    overflow:hidden;

    flex-shrink:0;

    display:flex;
    align-items:center;
}

/* БЕГУЩАЯ СТРОКА */

.marquee{

    position:absolute;

    white-space:nowrap;

    color:white;

    font-size:20px;

    letter-spacing:5px;

    animation:
    marquee 14s linear infinite;
}

@keyframes marquee{

    from{
        transform:translateX(100%);
    }

    to{
        transform:translateX(-100%);
    }
}

/* ====================================
   СКРОЛЛ ЦЕНТРА
==================================== */

.center{

    flex:1;

    overflow-y:auto;

    padding:10px 12px 20px;

    scrollbar-width:none;
}

.center::-webkit-scrollbar{
    display:none;
}

/* ====================================
   ВНУТРЕННИЙ КОНТЕЙНЕР
==================================== */

.content{

    width:100%;

    max-width:430px;

    margin:auto;
}

/* ====================================
   БЛОК КНОПОК
==================================== */

.buttons-box{

    height:calc(100vh - 80px);

    min-height:560px;

    border:
    10px solid #220000;

    border-radius:38px;

    background:
    linear-gradient(
        to bottom,
        rgba(60,0,0,0.45),
        rgba(0,0,0,0.15)
    );

    padding:14px;

    display:flex;
    flex-direction:column;

    gap:12px;
}

/* ====================================
   КНОПКИ
==================================== */

.sound-btn{

    flex:1;

    border:none;

    border-radius:20px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    color:white;

    font-weight:bold;

    cursor:pointer;

    transition:0.15s;

    min-height:0;
}

.sound-btn:active{

    transform:scale(0.985);
}

/* ИКОНКИ */

.sound-btn img{

    width:min(22vw,110px);

    height:min(22vw,110px);

    object-fit:contain;

    margin-bottom:20px;

    pointer-events:none;
}

/* ТЕКСТ */

.sound-btn span{

    font-size:
    clamp(22px,4vw,34px);
}

/* ЦВЕТА */

.record{
    background:#b50000;
}

.play{
    background:#00d000;
}

.reverse{
    background:#1580f0;
}

/* ====================================
   НИЖНИЙ БЛОК
==================================== */

.bottom{

    padding-top:14px;
}

/* ДОБАВИТЬ НА ЭКРАН */

.install-btn{

    width:100%;

    height:76px;

    border:none;

    border-radius:28px;

    background:#250000;

    color:white;

    font-size:
    clamp(22px,4vw,32px);

    font-weight:bold;

    cursor:pointer;

    margin-bottom:12px;
}

.install-btn:active{

    transform:scale(0.985);
}

/* ФУТЕР */

.footer{

    width:100%;

    height:74px;

    background:#290000;

    border-radius:30px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 16px;
}

/* COPYRIGHT */

.copy{

    font-size:
    clamp(15px,3vw,24px);

    color:white;
}

/* VPN КНОПКА */

.vpn-btn{

    background:#1580f0;

    color:white;

    text-decoration:none;

    padding:14px 28px;

    border-radius:20px;

    font-size:
    clamp(18px,4vw,32px);

    font-weight:bold;
}

/* ====================================
   МАЛЕНЬКИЕ ЭКРАНЫ
==================================== */

@media(max-height:760px){

    .header{
        height:48px;
    }

    .buttons-box{

        padding:10px;

        gap:10px;
    }

    .sound-btn img{

        width:72px;
        height:72px;

        margin-bottom:12px;
    }

    .install-btn{

        height:64px;
    }

    .footer{

        height:62px;
    }
}

</style>
</head>

<body>

<div class="app">

    <!-- =========================
         ШАПКА
    ========================== -->

    <div class="header">

        <div class="marquee">

            RatVad VPN - 150руб, стабильно анонимно •
            RatVad VPN - 150руб, стабильно анонимно •
            RatVad VPN - 150руб, стабильно анонимно •

        </div>

    </div>

    <!-- =========================
         СКРОЛЛ
    ========================== -->

    <div class="center">

        <div class="content">

            <!-- =========================
                 КНОПКИ
            ========================== -->

            <div class="buttons-box">

                <!-- ЗАПИСЬ -->

                <button
                class="sound-btn record"
                id="recordBtn">

                    <!-- ВСТАВЬ ССЫЛКУ -->
                    <img src="https://raw.githubusercontent.com/TrashBagStudio/Recorder/refs/heads/main/micro.png">

                    <span>
                        Запись звука
                    </span>

                </button>

                <!-- ПРОИГРАТЬ -->

                <button
                class="sound-btn play"
                id="playBtn">

                    <!-- ВСТАВЬ ССЫЛКУ -->
                    <img src="https://raw.githubusercontent.com/TrashBagStudio/Recorder/refs/heads/main/play.png">

                    <span>
                        Играть запись
                    </span>

                </button>

                <!-- РЕВЕРС -->

                <button
                class="sound-btn reverse"
                id="reverseBtn">

                    <!-- ВСТАВЬ ССЫЛКУ -->
                    <img src="https://raw.githubusercontent.com/TrashBagStudio/Recorder/refs/heads/main/reverse.png">

                    <span>
                        Реверс записи
                    </span>

                </button>

            </div>

            <!-- =========================
                 НИЖНИЙ БЛОК
            ========================== -->

            <div class="bottom">

                <!-- ДОБАВИТЬ -->

                <button
                class="install-btn"
                id="installBtn">

                    ДОБАВИТЬ ЯРЛЫК НА ЭКРАН

                </button>

                <!-- ФУТЕР -->

                <div class="footer">

                    <div class="copy">

                        Copyright RatVad VPN

                    </div>

                    <!-- ВСТАВЬ ССЫЛКУ -->

                    <a
                    class="vpn-btn"
                    href="VPN_LINK">

                        Наш VPN

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

/* ====================================
   ЗАПИСЬ
==================================== */

let mediaRecorder;

let audioChunks = [];

let recordedBlob = null;

let audioURL = null;

let audioPlayer = null;

/* КНОПКИ */

const recordBtn =
document.getElementById("recordBtn");

const playBtn =
document.getElementById("playBtn");

const reverseBtn =
document.getElementById("reverseBtn");

/* ====================================
   ЗАПИСЬ
==================================== */

recordBtn.onclick = async ()=>{

    try{

        /* ЕСЛИ УЖЕ ИДЕТ ЗАПИСЬ */

        if(
            mediaRecorder &&
            mediaRecorder.state === "recording"
        ){

            mediaRecorder.stop();

            recordBtn.style.opacity = "1";

            return;
        }

        /* ДОСТУП К МИКРОФОНУ */

        const stream =
        await navigator
        .mediaDevices
        .getUserMedia({
            audio:true
        });

        audioChunks = [];

        mediaRecorder =
        new MediaRecorder(stream);

        mediaRecorder.ondataavailable = e=>{

            audioChunks.push(e.data);
        };

        mediaRecorder.onstop = ()=>{

            recordedBlob =
            new Blob(audioChunks,{

                type:"audio/webm"
            });

            audioURL =
            URL.createObjectURL(
                recordedBlob
            );

            audioPlayer =
            new Audio(audioURL);
        };

        mediaRecorder.start();

        recordBtn.style.opacity = "0.7";

    }catch(err){

        alert("Нет доступа к микрофону");

        console.log(err);
    }
};

/* ====================================
   ПРОИГРАТЬ
==================================== */

playBtn.onclick = ()=>{

    if(!audioPlayer){

        alert("Сначала сделай запись");

        return;
    }

    audioPlayer.pause();

    audioPlayer.currentTime = 0;

    audioPlayer.play();
};

/* ====================================
   РЕВЕРС
==================================== */

reverseBtn.onclick = async ()=>{

    if(!recordedBlob){

        alert("Сначала сделай запись");

        return;
    }

    const arrayBuffer =
    await recordedBlob.arrayBuffer();

    const audioContext =
    new (
        window.AudioContext ||
        window.webkitAudioContext
    )();

    const buffer =
    await audioContext
    .decodeAudioData(arrayBuffer);

    for(
        let i=0;
        i<buffer.numberOfChannels;
        i++
    ){

        Array
        .prototype
        .reverse
        .call(
            buffer.getChannelData(i)
        );
    }

    const source =
    audioContext.createBufferSource();

    source.buffer = buffer;

    source.connect(
        audioContext.destination
    );

    source.start(0);
};

/* ====================================
   ДОБАВИТЬ НА ЭКРАН
==================================== */

let deferredPrompt;

window.addEventListener(
    "beforeinstallprompt",
    (e)=>{

        e.preventDefault();

        deferredPrompt = e;
    }
);

document
.getElementById("installBtn")
.onclick = async ()=>{

    if(deferredPrompt){

        deferredPrompt.prompt();

    }else{

        alert(
            "Открой сайт через Chrome на Android"
        );
    }
};

</script>

</body>
</html>
